---
name: Unit Tests

"on":
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  account-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Configure Ubuntu mirrors for browser dependencies
        run: |
          # Avoid the Azure mirror's intermittent font-download stalls.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-browser-ci-network
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Test account cards
        run: python -m unittest discover -s tests -p 'test_*card.py' -v

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: >-
          python -c "import json, subprocess, sys;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          *json.load(open('custom_components/dtek_monitor/manifest.json'))['requirements'], 'Jinja2==3.1.6'])"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile integration
        run: python -m compileall custom_components tests

  home-assistant-runtime:
    strategy:
      fail-fast: false
      matrix:
        home-assistant: ["2026.3.0", "2026.10.2"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant and integration requirements
        run: |
          python -m pip install homeassistant==${{ matrix.home-assistant }}
          python - <<'PYCODE'
          import json, pathlib, subprocess, sys
          manifest = pathlib.Path(
              "custom_components/dtek_monitor/manifest.json"
          )
          requirements = json.loads(manifest.read_text())["requirements"]
          subprocess.check_call([sys.executable, "-m", "pip", "install",
                                 *requirements])
          PYCODE
      - name: Test with real Home Assistant classes
        run: python -m unittest discover -s tests -v
